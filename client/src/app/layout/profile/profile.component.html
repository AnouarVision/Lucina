<div class="bg-gradient-to-r from-[#a9876e] to-[#8b6f4f] text-white py-16 px-4">
  <div class="max-w-4xl mx-auto text-center">
    <h1 class="text-4xl font-bold mb-4">Il tuo account</h1>
    <p class="text-lg opacity-90">Accedi o registrati per procedere al checkout</p>
  </div>
</div>

<div class="min-h-screen bg-[#f7f1eb] py-12 px-4">
  <div class="max-w-md mx-auto bg-white rounded-lg shadow-lg p-8">
    <div class="flex gap-4 mb-8 border-b">
      <button
        (click)="activeTab = 'login'"
        [class.text-[#a9876e]]="activeTab === 'login'"
        [class.border-b-2]="activeTab === 'login'"
        [class.border-[#a9876e]]="activeTab === 'login'"
        class="flex-1 pb-4 font-semibold transition text-gray-600"
      >
        Accedi
      </button>
      <button
        (click)="activeTab = 'signup'"
        [class.text-[#a9876e]]="activeTab === 'signup'"
        [class.border-b-2]="activeTab === 'signup'"
        [class.border-[#a9876e]]="activeTab === 'signup'"
        class="flex-1 pb-4 font-semibold transition text-gray-600"
      >
        Registrati
      </button>
    </div>

    @if (activeTab === 'login') {
      <div class="space-y-4">
        @if (loginError) {
          <div class="p-3 bg-red-50 border border-red-200 rounded text-red-700 text-sm">
            {{ loginError }}
          </div>
        }

        <div>
          <label class="block font-semibold text-gray-700 mb-2">Email</label>
          <input
            type="email"
            [(ngModel)]="loginEmail"
            placeholder="tue@example.com"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#a9876e]"
          />
        </div>

        <div>
          <label class="block font-semibold text-gray-700 mb-2">Password</label>
          <input
            type="password"
            [(ngModel)]="loginPassword"
            placeholder="••••••••"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#a9876e]"
          />
        </div>

        <button
          (click)="login()"
          [disabled]="isLoading"
          class="w-full bg-[#a9876e] text-white py-3 rounded-lg font-semibold hover:bg-[#8b6f4f] transition mt-4 disabled:opacity-50 disabled:cursor-not-allowed"
        >
          {{ isLoading ? 'Elaborazione...' : 'Accedi' }}
        </button>

        <div class="relative py-4">
          <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-gray-300"></div>
          </div>
          <div class="relative flex justify-center text-sm">
            <span class="px-2 bg-white text-gray-500">oppure</span>
          </div>
        </div>

        <button
          (click)="continueAsGuest()"
          class="w-full border-2 border-[#a9876e] text-[#a9876e] py-3 rounded-lg font-semibold hover:bg-amber-50 transition"
        >
          Continua senza account
        </button>
      </div>
    }

    @if (activeTab === 'signup') {
      <div class="space-y-4">
        @if (signupError) {
          <div class="p-3 bg-red-50 border border-red-200 rounded text-red-700 text-sm">
            {{ signupError }}
          </div>
        }

        <div>
          <label class="block font-semibold text-gray-700 mb-2">Nome</label>
          <input
            type="text"
            [(ngModel)]="signupName"
            placeholder="Il tuo nome"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#a9876e]"
          />
        </div>

        <div>
          <label class="block font-semibold text-gray-700 mb-2">Email</label>
          <input
            type="email"
            [(ngModel)]="signupEmail"
            placeholder="tue@example.com"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#a9876e]"
          />
        </div>

        <div>
          <label class="block font-semibold text-gray-700 mb-2">Password</label>
          <input
            type="password"
            [(ngModel)]="signupPassword"
            placeholder="••••••••"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#a9876e]"
          />
        </div>

        <div>
          <label class="block font-semibold text-gray-700 mb-2">Conferma Password</label>
          <input
            type="password"
            [(ngModel)]="signupConfirmPassword"
            placeholder="••••••••"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#a9876e]"
          />
        </div>

        <div class="flex items-start gap-3 pt-1">
          <input
            type="checkbox"
            id="gdprConsent"
            [(ngModel)]="gdprAccepted"
            class="mt-1 w-4 h-4 accent-[#a9876e] cursor-pointer shrink-0"
          />
          <label for="gdprConsent" class="text-sm text-gray-600 leading-snug cursor-pointer">
            Ho letto e accetto la
            <a [routerLink]="'/privacy-policy'" target="_blank" class="text-[#a9876e] underline hover:text-[#8b6f4f]">Privacy Policy</a>
            e i
            <a [routerLink]="'/terms-of-service'" target="_blank" class="text-[#a9876e] underline hover:text-[#8b6f4f]">Termini di Servizio</a>.
            Acconsento al trattamento dei miei dati personali per la gestione dell'account e degli ordini.
            <span class="text-red-500">*</span>
          </label>
        </div>

        <button
          (click)="signup()"
          [disabled]="isLoading"
          class="w-full bg-[#a9876e] text-white py-3 rounded-lg font-semibold hover:bg-[#8b6f4f] transition mt-4 disabled:opacity-50 disabled:cursor-not-allowed"
        >
          {{ isLoading ? 'Elaborazione...' : 'Registrati' }}
        </button>

        <div class="relative py-4">
          <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-gray-300"></div>
          </div>
          <div class="relative flex justify-center text-sm">
            <span class="px-2 bg-white text-gray-500">oppure</span>
          </div>
        </div>

        <button
          (click)="continueAsGuest()"
          class="w-full border-2 border-[#a9876e] text-[#a9876e] py-3 rounded-lg font-semibold hover:bg-amber-50 transition"
        >
          Continua senza account
        </button>
      </div>
    }

    <div class="text-center mt-6">
      <button
        (click)="goHome()"
        class="text-gray-600 hover:text-[#a9876e] transition"
      >
        ← Torna alla home
      </button>
    </div>
  </div>
</div>
