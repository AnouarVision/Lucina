<div class="max-w-5xl mx-auto p-8">
  <h1 class="text-4xl font-bold text-center text-[#a9876e] mb-8">Skincare Routine</h1>
  <p class="text-center text-gray-700 mb-12">
    Segui la nostra guida step-by-step per una pelle sana e luminosa. Adatta ogni step al tuo tipo di pelle.
  </p>

  <!-- Routine Steps -->
  <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
    <mat-card *ngFor="let step of routines" class="p-6 shadow-md hover:shadow-lg transition-shadow text-center">
      <mat-icon class="text-5xl text-[#a9876e] mb-4">{{ step.icon }}</mat-icon>
      <h3 class="text-xl font-semibold mb-2">{{ step.title }}</h3>
      <p class="text-gray-600">{{ step.description }}</p>
    </mat-card>
  </div>

  <!-- Call to Action -->
  <div class="text-center mt-12">
    <button mat-flat-button class="bg-[#a9876e] text-white hover:bg-[#8a705a] py-2 px-6 rounded-lg">
      Scopri i prodotti consigliati
    </button>
  </div>
</div>
