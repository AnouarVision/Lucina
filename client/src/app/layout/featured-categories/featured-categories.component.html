<section class="bg-white py-14 px-4">
  <div class="max-w-6xl mx-auto">
    <div class="text-center mb-10">
      <h2 class="text-3xl font-semibold text-gray-800 mb-2">Categorie in evidenza</h2>
      <p class="text-gray-500">Trova il prodotto giusto per ogni step della tua routine</p>
    </div>

    <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-4">
      @for (cat of categories; track cat.filter) {
        <a [routerLink]="'/shop'" [queryParams]="{ type: cat.filter }"
           class="group flex flex-col items-center gap-3 p-5 rounded-2xl border border-[#efe5db]
                  bg-[#f7f1eb] hover:bg-[#a9876e] transition-all duration-300 cursor-pointer">
          <div class="w-14 h-14 flex items-center justify-center rounded-full
                      bg-white group-hover:bg-white/20 transition-all duration-300 shadow-sm">
            <mat-icon class="text-[#a9876e] text-[28px] group-hover:text-white transition-colors">{{ cat.icon }}</mat-icon>
          </div>
          <div class="text-center">
            <p class="font-semibold text-gray-800 text-sm group-hover:text-white transition-colors leading-tight">{{ cat.label }}</p>
            <p class="text-xs text-gray-400 group-hover:text-white/80 transition-colors mt-1 leading-tight">{{ cat.sublabel }}</p>
          </div>
        </a>
      }
    </div>
  </div>
</section>
