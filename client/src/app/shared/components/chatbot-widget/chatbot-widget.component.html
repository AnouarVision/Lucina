<!-- Floating Chat Button -->
<div class="fixed bottom-6 right-6 z-50">
  @if (!isOpen()) {
    <button
      (click)="toggleChat()"
      class="w-16 h-16 rounded-full bg-gradient-to-br from-[#a9876e] to-[#8b6f4f] text-white shadow-lg hover:shadow-2xl transition-all duration-300 hover:scale-110 flex items-center justify-center group">
      <mat-icon class="text-4xl group-hover:animate-bounce">chat_bubble</mat-icon>
    </button>
  } @else {
    <!-- Chat Window -->
    <div class="bg-white rounded-2xl shadow-2xl overflow-hidden w-96 h-[600px] flex flex-col border border-[#a9876e]/20 animate-slide-up">
      <!-- Header -->
      <div class="bg-gradient-to-r from-[#a9876e] to-[#8b6f4f] text-white p-4 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div>
            <h3 class="font-bold text-lg">Lucina Assistant</h3>
            <p class="text-xs text-[#f7f1eb]">Alimentato da Gemini</p>
          </div>
        </div>
        <button
          (click)="closeChat()"
          mat-icon-button
          class="text-white hover:bg-white/20 rounded-full">
          <mat-icon>close</mat-icon>
        </button>
      </div>

      <!-- Messages Area -->
      <div class="flex-1 overflow-y-auto p-4 space-y-4 bg-gradient-to-b from-[#f7f1eb] to-white">
        @for (message of messages(); track message.id) {
          <div [class.text-right]="message.sender === 'user'" class="flex" [class.justify-end]="message.sender === 'user'">
            <div [class]="message.sender === 'user'
              ? 'bg-[#a9876e] text-white rounded-2xl rounded-tr-none'
              : 'bg-gray-200 text-gray-900 rounded-2xl rounded-tl-none'"
              class="max-w-xs px-4 py-2 break-words shadow-sm">
              <p class="text-sm">{{ message.text }}</p>
              <p class="text-xs mt-1 opacity-70">{{ message.timestamp | date:'HH:mm' }}</p>
            </div>
          </div>
        }

        @if (isLoading()) {
          <div class="flex gap-2 items-end">
            <div class="bg-gray-300 rounded-full w-2 h-2 animate-bounce"></div>
            <div class="bg-gray-300 rounded-full w-2 h-2 animate-bounce delay-100"></div>
            <div class="bg-gray-300 rounded-full w-2 h-2 animate-bounce delay-200"></div>
          </div>
        }

        @if (errorMessage()) {
          <div class="bg-red-100 border border-red-300 text-red-700 px-3 py-2 rounded-lg text-sm">
            {{ errorMessage() }}
          </div>
        }
      </div>

      <!-- Input Area -->
      <div class="bg-white border-t border-gray-200 p-3 space-y-2">
        <div class="flex gap-2">
          <input
            type="text"
            [(ngModel)]="newMessage"
            (keypress)="onKeyPress($event)"
            placeholder="Scrivi una domanda..."
            maxlength="500"
            class="flex-1 px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-[#a9876e] text-sm"
            [disabled]="isLoading()">
          <button
            (click)="sendMessage()"
            [disabled]="!newMessage().trim() || isLoading()"
            class="px-3 py-2 bg-[#a9876e] text-white rounded-lg hover:bg-[#8b6f4f] transition-all disabled:opacity-50 disabled:cursor-not-allowed">
            <mat-icon class="text-lg">send</mat-icon>
          </button>
        </div>
        <button
          (click)="clearChat()"
          class="w-full text-xs text-gray-600 hover:text-gray-900 py-1 transition">
          ↻ Nuova conversazione
        </button>
      </div>
    </div>
  }
</div>
