<div class="cart-item-wrapper" [class.removing]="isRemoving()">
  <div class="cart-item-container bg-white rounded-lg shadow-md hover:shadow-lg transition-shadow p-4 mb-4">
    <!-- Product Image -->
    <div class="cart-item-image">
      <img
        [src]="'https://localhost:5001' + item.imageUrl"
        [alt]="item.name"
        class="w-20 h-20 object-cover rounded-lg">
    </div>

    <!-- Product Details -->
    <div class="cart-item-details">
      <h3 class="font-bold text-lg text-gray-800">{{ item.name }}</h3>
      <p class="text-gray-600 text-sm">€ {{ item.price | number:'1.2-2' }} al pezzo</p>
    </div>

    <!-- Quantity controls -->
    <div class="cart-item-quantity">
      <div class="flex items-center border border-gray-300 rounded-lg p-1">
        <button
          (click)="decreaseQuantity()"
          [disabled]="item.quantity <= 1"
          class="px-3 py-1 text-gray-600 hover:text-gray-800 disabled:opacity-50 disabled:cursor-not-allowed transition">
          <mat-icon class="text-xl">remove</mat-icon>
        </button>
        <span class="px-4 py-1 font-semibold text-center min-w-12">{{ item.quantity }}</span>
        <button
          (click)="increaseQuantity()"
          [disabled]="item.quantity >= effectiveMax"
          class="px-3 py-1 text-gray-600 hover:text-gray-800 disabled:opacity-50 disabled:cursor-not-allowed transition">
          <mat-icon class="text-xl">add</mat-icon>
        </button>
      </div>
    </div>

    <!-- Total -->
    <div class="cart-item-total">
      <div class="flex flex-col items-end">
        <p class="text-sm text-gray-600 mb-1">Totale</p>
        <p class="text-2xl font-bold text-[#a9876e]">€ {{ itemTotal | number:'1.2-2' }}</p>
      </div>
    </div>

    <!-- Remove button -->
    <div class="cart-item-remove">
      <button
        (click)="removeItem()"
        class="p-2 text-red-500 hover:bg-red-50 rounded-lg transition"
        title="Rimuovi dal carrello">
        <mat-icon class="text-2xl">delete_outline</mat-icon>
      </button>
    </div>
  </div>
</div>
