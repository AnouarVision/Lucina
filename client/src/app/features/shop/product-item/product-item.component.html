@if(product){
  <mat-card appearance="raised" class="overflow-hidden rounded-lg shadow-md">
    <img [src]="'https://localhost:5001' + product.pictureUrl" alt="image of {{product.name}}" class="w-full h-60 object-cover">

    <!-- Titolo e prezzo con padding -->
    <mat-card-title class="px-4 pt-4 text-lg font-semibold">{{product.name}}</mat-card-title>
    <mat-card-subtitle class="px-4 pb-4 text-gray-700">{{product.price | currency:'EUR'}}</mat-card-subtitle>

    <!-- Azioni -->
    <mat-card-actions class="px-4 pb-4 flex flex-col gap-2">
      <button mat-stroked-button class="w-full px-4 py-2 text-[#a9876e] border-[#a9876e] hover:bg-[#f7f1eb]">
        <mat-icon>search</mat-icon> Scopri
      </button>
      <button mat-stroked-button class="w-full px-4 py-2 text-[#a9876e] border-[#a9876e] hover:bg-[#f7f1eb]">
        <mat-icon>add_shopping_cart</mat-icon> Al carrello
      </button>
    </mat-card-actions>
  </mat-card>
}
